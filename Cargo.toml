[package]
name = "melchior"
version = "0.1.0"
edition = "2024"
description = "One agent talking to another: naming, finding, reaching and refusing"
license = "MIT"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "melchior"
path = "src/main.rs"

# No harness among them. melchior was lifted out of one and is meant to be usable by another, so
# anything that knew what a *transcript* was would put it back where it started. A conversation is
# not that: a model, a message and a token count are provider-neutral, and owning them is what
# makes melchior an agent runtime rather than a message bus. What a harness needs still crosses as
# data and as bytes on a pipe.
[dependencies]
rustix = { version = "0.38", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
# `signal` because the way a `serve` actually ends is a `SIGTERM` from the kernel, and a signal
# nothing waits for runs none of the lines that take this session's socket and notes back down —
# see `src/ending.rs` for why it is waited for rather than handled here. A feature on the runtime
# this program already runs its whole loop on, which is one crate in the lockfile
# (`signal-hook-registry`) and no new name in this list.
tokio = { version = "1", features = ["rt", "net", "io-util", "fs", "time", "sync", "macros", "signal"] }

# The mind: talking to a model, and the Lua the protocols are written in.
base64 = "0.22"
ciborium = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
luna = { git = "https://github.com/onix-os/luna", tag = "v0.5.0" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
sha2 = "0.10"
thiserror = "2.0"
anyhow = "1"

[dev-dependencies]

# The same gate this code was written under, not a stricter one. Tightening it on the way out
# would mean rewriting working code to satisfy a rule nobody had chosen, in the same change that
# is meant to prove it moved unaltered.
[lints.rust]
unsafe_code = "deny"
# A dependency nothing uses is a lie about the graph — an edge that exists in `Cargo.toml`, in
# the lockfile and in every diagram somebody draws from them, and nowhere in the code. Nine of
# them were declared across this family.
#
# Enforced by `cargo machete` in `verify`, not by `unused_crate_dependencies`. That lint finds
# the same thing and then finds a great deal more: it runs per *target*, so every integration
# test is reported for every dev-dependency that one file happens not to name — twenty-odd
# warnings here, none of them a lie, and `clippy -Dwarnings` fails on all of them. machete reads
# the manifest against the whole package and has no such blind spot.
unused = { level = "deny", priority = -1 }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
