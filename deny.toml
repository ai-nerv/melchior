# The dependency policy `cargo deny check` holds this crate to, in `make verify` and in CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
]

# A git dependency counts as a wildcard: the only one is luna, pinned by tag in Cargo.toml.
[bans]
multiple-versions = "allow"
wildcards = "allow"

# crates.io, and one git repository: luna, the Lua VM, which is not published there.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/onix-os/luna"]
